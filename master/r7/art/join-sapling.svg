<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-label="A glowing sapling in a pot, waiting to be planted, joined by threads of light to a home in Kerala and a home in Germany."><title>A glowing sapling in a pot, waiting to be planted, joined by threads of light to a home in Kerala and a home in Germany.</title><style>
.tw{animation:tw 4s ease-in-out infinite}.tw2{animation:tw 5.5s ease-in-out 1.5s infinite}
@keyframes tw{50%{opacity:.25}}
.ff{animation:ff 7s ease-in-out infinite}.ff:nth-of-type(2n){animation-duration:9s;animation-delay:-3s}.ff:nth-of-type(3n){animation-delay:-5s}
@keyframes ff{50%{transform:translate(10px,-14px);opacity:.35}}
.bob{animation:bob 5s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-6px)}}
.wv rect{transform-box:fill-box;transform-origin:center;animation:wv 1.1s ease-in-out infinite}
.wv rect:nth-child(2n){animation-delay:.2s}.wv rect:nth-child(3n){animation-delay:.4s}
@keyframes wv{50%{transform:scaleY(.45)}}
.pulse{animation:pl 2.6s ease-in-out infinite}@keyframes pl{50%{opacity:.45}}
.flow{stroke-dasharray:6 14;animation:flow 2.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-40}}
.tail{transform-box:fill-box;animation:wag .7s ease-in-out infinite alternate}@keyframes wag{from{transform:rotate(-8deg)}to{transform:rotate(10deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs>
